name: nc-plus-one-deployment

on:
  push:
    branches:
      - main

jobs:
  run-tests:
    name: run-tests
    runs-on: ubuntu-latest

    env:
      DATABASE_NAME: nc_plus_one_test
      DATABASE_USER: postgres
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14' 
      
      - name: Install postgres
        run: sudo apt update && sudo apt-get install postgresql -y

      - name: Start postgres
        run: |
          sudo systemctl start postgresql
          sudo systemctl status postgresql --no-pager
          pg_isready

      - name: Install dependencies
        run: make requirements

      - name: Setup dev
        run: make dev-setup

      - name: Run tests
        run: make run-checks


